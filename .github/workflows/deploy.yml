name: Deploy Cadence

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install wrangler
        run: npm install -g wrangler@4

      - name: Apply D1 migrations (remote)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler d1 migrations apply cadence-db --remote

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler deploy 2>&1 | tee /tmp/wrangler-deploy.log

      - name: Smoke-test deployed URL
        # Always runs — picks APP_URL (custom domain) if set, otherwise parses the
        # workers.dev URL from `wrangler deploy` output. Failing this step means the
        # deployed app is unreachable, which is exactly the kind of silent failure
        # we want a CI gate to surface.
        env:
          APP_URL: ${{ vars.APP_URL }}
          DEPLOY_LOG: /tmp/wrangler-deploy.log
        run: |
          if [ -z "$APP_URL" ]; then
            # Cloudflare prints URLs like https://<worker>.<subhash>.workers.dev
            APP_URL=$(grep -oE 'https://[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev' "$DEPLOY_LOG" | head -1)
          fi
          if [ -z "$APP_URL" ]; then
            echo "::error::Could not determine deployed URL — set the APP_URL repo variable or surface it from wrangler deploy output."
            exit 1
          fi
          echo "Curl-testing $APP_URL/api/health ..."
          ok=0
          for i in 1 2 3 4 5; do
            body="$(curl -fsSL "$APP_URL/api/health" 2>/dev/null || true)"
            if [ -n "$body" ] && echo "$body" | grep -q '"ok":true'; then
              echo " ✓ Health OK: $body"
              ok=1
              break
            fi
            echo "  attempt $i: no healthy response, retrying in 3s"
            sleep 3
          done
          if [ "$ok" != "1" ]; then
            echo "::error::Deployed URL $APP_URL did not return a healthy /api/health within 15s."
            exit 1
          fi